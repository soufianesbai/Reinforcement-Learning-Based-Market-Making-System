<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketMind — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px;
      width: 360px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e6edf3;
      letter-spacing: -0.3px;
    }
    .brand-text p {
      font-size: 12px;
      color: #8b949e;
      margin-top: 2px;
    }
    .field-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #4aa3ff; }
    input::placeholder { color: #484f58; }
    .submit-btn {
      width: 100%;
      padding: 11px;
      background: #4aa3ff;
      color: #0d1117;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, opacity 0.15s;
    }
    .submit-btn:hover:not(:disabled) { background: #79beff; }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .error-msg {
      color: #f85149;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 20 20" fill="none">
        <path d="M2 14L6 10L9 12L14 6L18 8" stroke="#4aa3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17H18" stroke="#9fb3d1" stroke-width="1" opacity=".65"/>
      </svg>
      <div class="brand-text">
        <h1>MarketMind</h1>
        <p>Live Testnet Trading</p>
      </div>
    </div>

    <div class="field-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="field-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="submit-btn" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <script>
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');

      if (!username) { errorEl.textContent = 'Username is required.'; return; }

      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.replace('/');
        } else {
          errorEl.textContent = data.message || 'Invalid credentials.';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (_) {
        errorEl.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
